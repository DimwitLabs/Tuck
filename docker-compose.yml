services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    command: ["postgres", "-c", "listen_addresses="]
    network_mode: none
    environment:
      POSTGRES_DB: tuck
      POSTGRES_USER: tuck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, see .env.example}
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
      - postgres_socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuck"]
      interval: 5s
      retries: 10

  tuck:
    image: ghcr.io/dimwitlabs/tuck:${TUCK_VERSION:-latest}
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - postgres_socket:/var/run/postgresql
    ports:
      - "${TUCK_BIND:-127.0.0.1}:${TUCK_PORT:-8080}:8080"
    environment:
      TUCK_SECRET: ${TUCK_SECRET:?set TUCK_SECRET in .env - openssl rand -hex 32}
      TUCK_DATABASE_URL: postgres://tuck:${POSTGRES_PASSWORD}@/tuck?host=/var/run/postgresql
      TUCK_DB_SCHEMA: ${TUCK_DB_SCHEMA:-tuck}
      TUCK_FEATURES: ${TUCK_FEATURES:-both}
      TUCK_TRUSTED_PROXIES: ${TUCK_TRUSTED_PROXIES:-}
      TUCK_SECURE_COOKIES: ${TUCK_SECURE_COOKIES:-true}
      TUCK_SESSION_HOURS: ${TUCK_SESSION_HOURS:-12}
      TUCK_MAX_FILE_MB: ${TUCK_MAX_FILE_MB:-25}
      TUCK_FREEZE_AFTER: ${TUCK_FREEZE_AFTER:-6}
      TUCK_GATE_PASSWORD: ${TUCK_GATE_PASSWORD:-}
      TUCK_GATE_WORD: ${TUCK_GATE_WORD:-}
      TUCK_MAX_ITEMS: ${TUCK_MAX_ITEMS:-5000}
      TUCK_MAX_STORAGE_MB: ${TUCK_MAX_STORAGE_MB:-1024}

volumes:
  postgres_data:
  postgres_socket:

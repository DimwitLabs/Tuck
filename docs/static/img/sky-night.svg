<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 576">
  <style>
  .star { fill: #d9e0e8; }
  .moon { fill: #d6ad62; opacity: 0.85; }
  .cloud { animation: drift 90s ease-in-out infinite alternate; }
  .cloud.slow { animation-duration: 140s; animation-direction: alternate-reverse; }
  .star.twinkle { animation: twinkle 4s ease-in-out infinite; }
  .star.twinkle:nth-child(3n) { animation-delay: -1.3s; animation-duration: 5.5s; }
  .star.twinkle:nth-child(3n + 1) { animation-delay: -2.6s; animation-duration: 3.2s; }
  @keyframes drift { to { transform: translateX(-70px); } }
  @keyframes twinkle { 50% { opacity: 0.2; } }
  @media (prefers-reduced-motion: reduce) { .cloud, .star.twinkle { animation: none; } }
  </style>
